name: Compilar APK

on:
  workflow_dispatch:
  push:
    branches: ['**']

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Instalar dependencias
        run: npm install

      - name: Copiar fuentes
        run: |
          mkdir -p www/fonts
          for f in bricolage-grotesque-latin-600-normal bricolage-grotesque-latin-800-normal; do
            cp node_modules/@fontsource/bricolage-grotesque/files/$f.woff2 www/fonts/ || echo "::warning::No se encontró $f"
          done
          for f in dm-sans-latin-400-normal dm-sans-latin-500-normal dm-sans-latin-700-normal; do
            cp node_modules/@fontsource/dm-sans/files/$f.woff2 www/fonts/ || echo "::warning::No se encontró $f"
          done
          ls -la www/fonts

      - name: Crear proyecto Android
        run: npx cap add android

      - name: Generar iconos
        continue-on-error: true
        run: npx @capacitor/assets generate --android --iconBackgroundColor '#4B2E73' --iconBackgroundColorDark '#4B2E73'

      - name: Arreglar fondo del icono
        run: |
          mkdir -p android/app/src/main/res/mipmap-anydpi-v26
          printf '%s\n' '<?xml version="1.0" encoding="utf-8"?>' '<shape xmlns:android="http://schemas.android.com/apk/res/android" android:shape="rectangle">' '  <solid android:color="#4B2E73"/>' '</shape>' > android/app/src/main/res/mipmap-anydpi-v26/ic_launcher_background.xml

      - name: Numero de version
        run: |
          sed -i "s/__BUILD__/${{ github.run_number }}/" www/index.html
          sed -i "s/versionCode 1/versionCode ${{ github.run_number }}/; s/versionName \"1.0\"/versionName \"1.0.${{ github.run_number }}\"/" android/app/build.gradle
          grep -n "versionCode\|versionName" android/app/build.gradle

      - name: Permiso de contactos
        run: |
          sed -i 's#</manifest>#    <uses-permission android:name="android.permission.READ_CONTACTS" />\n    <uses-permission android:name="android.permission.WRITE_CONTACTS" />\n</manifest>#' android/app/src/main/AndroidManifest.xml
          grep -n "CONTACTS" android/app/src/main/AndroidManifest.xml

      - name: Firma fija
        run: |
          mkdir -p ~/.android
          cp keystore/debug.keystore ~/.android/debug.keystore
          cat >> android/app/build.gradle <<'GRADLE'

          android {
              signingConfigs {
                  debug {
                      storeFile file("${rootProject.projectDir}/../keystore/debug.keystore")
                      storePassword "android"
                      keyAlias "androiddebugkey"
                      keyPassword "android"
                  }
              }
          }
          GRADLE
          tail -12 android/app/build.gradle

      - name: Sincronizar archivos web
        run: npx cap sync android

      - name: Compilar APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Mostrar huella de firma
        continue-on-error: true
        run: |
          echo "Clave del repositorio:"
          keytool -list -v -keystore keystore/debug.keystore -storepass android | grep "SHA256:"
          echo "Clave del APK:"
          keytool -printcert -jarfile android/app/build/outputs/apk/debug/app-debug.apk | grep "SHA256:"

      - uses: actions/upload-artifact@v4
        with:
          name: Turnos-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
